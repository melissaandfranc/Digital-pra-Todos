<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Digital para Todos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

    <a class="pular-para-conteudo" href="#principal">Pular para o conteúdo</a>

  <div class="barra-topo">
    <div class="marca"><span class="bolinha" aria-hidden="true"></span>Digital para Todos</div>
    <div class="ferramentas-acessibilidade" role="group" aria-label="Recursos de acessibilidade">
      <button id="btn-fonte-menos" aria-label="Diminuir letra">A−</button>
      <button id="btn-fonte-mais" aria-label="Aumentar letra">A+</button>
      <button id="btn-contraste" aria-pressed="false">Alto contraste</button>
      <button id="btn-voz" aria-pressed="false">Ler respostas</button>
    </div>
  </div>

  <main id="principal" class="conteudo">

  </main>

      <section class="hero">
      <span class="selo">✦ TECNOLOGIA SIMPLES, SEGURA E INCLUSIVA</span>
      <h1>O digital deve<br>ser para <span class="destaque">todos.</span></h1>
      <p class="texto-apoio">Entenda a tecnologia sem medo. Crie experiências que ninguém precise deixar de usar.</p>
      <div class="botoes-hero">
        <button class="botao botao-escuro" data-ir-para="tradutor">Quero entender tecnologia →</button>
        <button class="botao" data-ir-para="avaliador">Quero criar com inclusão</button>
      </div>
      <div class="selos-confianca">
        <span>Linguagem simples</span>
        <span>Acessível por princípio</span>
        <span>Seus dados protegidos</span>
      </div>
    </section>

  <script src="script.js"></script>
</body>
</html>
